services:
  - type: web
    name: code-runner
    runtime: python
    repo: https://github.com/ShivanshKumar760/code-runner-render    # separate repo, own history/CI
    branch: master
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 30"
    healthCheckPath: /
    autoDeploy: false                # deploys are triggered by that repo's GitHub Action
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9