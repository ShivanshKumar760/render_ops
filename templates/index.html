<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Python Code Runner</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: #0b0f14; color: #e6edf3; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; } .container { width: min(1100px, 94%); margin: 40px auto; } h1 { margin-bottom: 6px; font-size: 28px; } .subtitle { margin-top: 0; color: #8b949e; } .editor { margin-top: 24px; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; background: #0d1117; } .editor-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #161b22; border-bottom: 1px solid #30363d; color: #8b949e; font-size: 14px; } textarea { display: block; width: 100%; min-height: 360px; padding: 18px; resize: vertical; border: 0; outline: none; background: #0d1117; color: #e6edf3; font: 14px/1.6 "SFMono-Regular", Consolas, "Liberation Mono", monospace; tab-size: 4; } .actions { display: flex; align-items: center; gap: 12px; margin: 16px 0; } button { border: 0; border-radius: 7px; padding: 10px 18px; background: #238636; color: white; font-weight: 600; cursor: pointer; } button:hover { background: #2ea043; } button:disabled { opacity: 0.6; cursor: wait; } .status { color: #8b949e; font-size: 14px; } .output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .panel { border: 1px solid #30363d; border-radius: 10px; overflow: hidden; background: #0d1117; } .panel-header { padding: 10px 14px; background: #161b22; border-bottom: 1px solid #30363d; font-size: 14px; font-weight: 600; } pre { margin: 0; padding: 16px; min-height: 180px; max-height: 400px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 "SFMono-Regular", Consolas, monospace; } #stderr { color: #ff7b72; } .info { margin-top: 18px; color: #8b949e; font-size: 13px; } @media (max-width: 700px) { .output-grid { grid-template-columns: 1fr; } .container { margin: 24px auto; } textarea { min-height: 300px; } } </style> </head> <body> <main class="container"> <h1>Python Code Runner</h1> <p class="subtitle">Execute Python code in a constrained subprocess.</p>
<section class="editor">
  <div class="editor-header">
    <span>script.py</span>
    <span>Python 3</span>
  </div>

  <textarea id="code" spellcheck="false">print("Hello, world!")


for i in range(5):
print(i)</textarea>
</section>

<div class="actions">
  <button id="runButton" onclick="runCode()">▶ Run Code</button>
  <span class="status" id="status"></span>
</div>

<section class="output-grid">
  <div class="panel">
    <div class="panel-header">stdout</div>
    <pre id="stdout"></pre>
  </div>

  <div class="panel">
    <div class="panel-header">stderr</div>
    <pre id="stderr"></pre>
  </div>
</section>

<p class="info">
  Execution limit: 5 seconds · Memory limit: 100 MB · Output limit: 1 MB
</p>
</main> <script> const codeEditor = document.getElementById("code"); const runButton = document.getElementById("runButton"); const status = document.getElementById("status"); const stdout = document.getElementById("stdout"); const stderr = document.getElementById("stderr"); async function runCode() { const code = codeEditor.value; if (!code.trim()) { status.textContent = "Enter some Python code first."; return; } runButton.disabled = true; status.textContent = "Running..."; stdout.textContent = ""; stderr.textContent = ""; try { const response = await fetch("/execute", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) }); const result = await response.json(); if (!response.ok) { stderr.textContent = result.error || "Execution failed."; status.textContent = "Error"; return; } stdout.textContent = result.stdout || ""; stderr.textContent = result.stderr || ""; status.textContent = `Finished · exit code ${result.exit_code}`; } catch (error) { stderr.textContent = error.message; status.textContent = "Request failed"; } finally { runButton.disabled = false; } } // Ctrl/Cmd + Enter runs the code. codeEditor.addEventListener("keydown", (event) => { if ((event.ctrlKey || event.metaKey) && event.key === "Enter") { event.preventDefault(); runCode(); } // Keep Tab as indentation instead of moving focus. if (event.key === "Tab") { event.preventDefault(); const start = codeEditor.selectionStart; const end = codeEditor.selectionEnd; codeEditor.value = codeEditor.value.substring(0, start) + " " + codeEditor.value.substring(end); codeEditor.selectionStart = codeEditor.selectionEnd = start + 4; } }); </script> </body> </html>
